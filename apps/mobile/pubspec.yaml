name: panelya_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Turkce yerellestirme (bkz. AGENTS.md, production-bible.md): sistem
  # widget metinlerini (geri tooltip'i, secim menuleri, semantics
  # duyurulari) Turkce'ye cevirir. Flutter SDK'sinin bir parcasidir,
  # pub.dev'den ayrica versiyonlanan bir paket degildir; `intl` transitive
  # bagimlilik olarak gelir, dogrudan cagrilmadigi icin ayrica eklenmedi.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management (feature-first + Riverpod pattern devralindi, bkz.
  # docs/mobile-handoff.md ve ADR-019).
  flutter_riverpod: ^3.3.2
  # Deep-link hazir router.
  go_router: ^17.3.0
  # Merkezi API client icin minimum HTTP bagimliligi; dio veya baska agir
  # bir paket eklenmedi (AGENTS.md: gerekcesiz dependency yok).
  http: ^1.6.0
  # Cihaz-yerel "kaldigin yerden devam et" kaydi icin kalici depolama.
  # Gerekce (AGENTS.md'nin gerekcesiz dependency yasagina gerekceli istisna):
  # Flutter ekosisteminin standart, hafif anahtar-deger cozumu; dosya IO'sunu
  # elle yazmak, test edilmesi zor bir platform-kanali kodunu yeniden icat
  # etmek olurdu. Daha agir bir cozum (hive/isar/sqflite) bu basit
  # seri->bolum kaydi icin gerekli degil.
  shared_preferences: ^2.5.3
  # PKCE (RFC 7636) `code_challenge` uretimi icin SHA-256 (bkz.
  # lib/features/auth/data/pkce.dart, ADR-039). Gerekce (AGENTS.md'nin
  # gerekcesiz dependency yasagina gerekceli istisna): proje zaten bu paketi
  # `flutter_test`/`coverage` uzerinden GECISLI (transitive) olarak
  # cozuyordu (bkz. pubspec.lock); burada yalniz dogrudan bagimlilik olarak
  # tasrih ediliyor. dart:crypto standart kutuphanede yok; SHA-256'yi elle
  # yazmak (sabitler, padding, endianness) test edilmesi zor, guvenlik
  # acisindan riskli bir kod yolunu yeniden icat etmek olurdu. Paket
  # yalnizca hash hesaplar; ag/depolama/gomulu tarayici gibi baska hicbir
  # yetenek eklemez.
  crypto: ^3.0.7
  # Cevrimdisi okuma (bkz. lib/features/offline/, docs/local-gap-backlog.md
  # P2 madde 3) icin platforma gore doGru "uygulama belgeleri" dizinini
  # cozer. Gerekce (AGENTS.md'nin gerekcesiz dependency yasagina gerekceli
  # istisna): iOS/Android/masaustunde kalici dosya depolamasinin doGru
  # yolu FARKLIDIR ve resmi olmayan bir platform kanalini elle yazmak,
  # zaten Flutter ekibinin resmi/first-party cozdugu bir sorunu yeniden
  # icat etmek olurdu. Bu paket yalniz bir dizin yolu dondurur; ag,
  # depolama motoru veya baska bir yetenek eklemez — dosya IO'sunun kendisi
  # hala dart:io ile yazilir (bkz. FileSystemOfflineEpisodeRepository).
  path_provider: ^2.1.5
  # Push bildirimleri (bkz. docs/local-gap-backlog.md P2 madde 3, ADR-019
  # firebase katmani tasinmaz kararinin ISTISNASI — o karar Novel-Project'in
  # Firebase VERI katmanini (auth/db) kapsiyordu; burada Firebase yalniz
  # push bildirim TESLIMATI icin, Google/Apple'in kendi push altyapilarina
  # (FCM/APNs) dogrudan sarmalayici olarak kullaniliyor). Gerekce
  # (AGENTS.md'nin gerekcesiz dependency yasagina gerekceli istisna):
  # uzaktan push bildirimi platform SDK'si gerektirir; bunu elle (native
  # platform kanali) yazmak Google'in resmi/first-party cozdugu bir sorunu
  # yeniden icat etmek olurdu.
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  # Auth0 sistem tarayici Authorization Code + PKCE oturum acma (ADR-039).
  # Gerekce (AGENTS.md'nin gerekcesiz dependency yasagina gerekceli istisna):
  # ADR-039 embedded WebView'i acikca YASAKLIYOR; isletim sisteminin kendi
  # guvenli, uygulamanin DOM'a erisemedigi tarayici oturumunu
  # (ASWebAuthenticationSession/Custom Tabs) elle native platform kanali
  # yazarak acmak, Auth0'in resmi Flutter SDK'sinin de temelinde kullandigi
  # ayni first-party cozumu (bu paket) yeniden icat etmek olurdu.
  flutter_web_auth_2: ^5.0.3
  # Auth0 access/refresh tokenlarinin tek gercek saklanma yeri (ADR-039:
  # "Flutter bunu yalniz isletim sistemi secure storage katmaninda tutar").
  # Gerekce (AGENTS.md'nin gerekcesiz dependency yasagina gerekceli istisna):
  # iOS Keychain / Android Keystore-destekli EncryptedSharedPreferences
  # dogrudan native platform kanali gerektirir; zaten bagimlilik olan
  # SharedPreferences duz metin depolar ve ADR-039'u ihlal ederdi.
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # `SecureStorageTokenStore`/`SystemAuthBrowser` testlerinde gercek platform
  # kanalini (Keychain/Custom Tabs) cagirmadan sahte bir implementasyon
  # (`FlutterSecureStoragePlatform.instance`/`FlutterWebAuth2Platform.instance`)
  # takmak icin; zaten transitive bagimlilik olarak cozuluyordu, burada
  # yalniz dogrudan test bagimliligi olarak tasrih ediliyor.
  flutter_secure_storage_platform_interface: ^2.0.2
  flutter_web_auth_2_platform_interface: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

